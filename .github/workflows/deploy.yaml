name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  checkout:
    name: Checkout & Setup
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

  build:
    name: Build & Push Image
    runs-on: self-hosted
    needs: checkout
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: DockerHub Login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:$GIT_SHA .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:$GIT_SHA ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:v1.0

      - name: Push Docker Image
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:$GIT_SHA
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:v1.0

  deploy:
    name: Deploy on EC2 (Self-hosted)
    runs-on: self-hosted
    needs: scan
    steps:
      - name: Deploy v1.0 container
        run: |
          docker stop flask-app || true
          docker rm flask-app || true
          sleep 5
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:v1.0
          docker run -d --name flask-app -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:v1.0
          docker system prune -f
